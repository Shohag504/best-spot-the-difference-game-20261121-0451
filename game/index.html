<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dhaka Days — Spot the Difference</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="brand">
        <strong>Dhaka Days</strong>
        <span>Spot the Difference</span>
      </div>
      <div class="stat"><label>Scene</label><span id="hud-level">Rickshaw Street — Scene 1 of 3</span></div>
      <div class="stat"><label>Time</label><span id="hud-timer">90s</span></div>
      <div class="stat"><label>Score</label><span id="hud-score">0</span></div>
      <div class="stat hot"><label>Differences</label><span id="hud-left">5 left</span></div>
      <div class="stat"><label id="hud-hints">Hints: 3</label><span>&nbsp;</span></div>
      <div class="actions">
        <button id="btn-hint" type="button">Hint (H)</button>
        <button id="btn-restart" type="button">Restart (R)</button>
        <button id="btn-mute" type="button">Sound: on</button>
        <button id="btn-start" type="button" class="primary">Start</button>
      </div>
    </header>
    <canvas id="game" width="1280" height="600"></canvas>
    <footer>
      Click a difference on either picture — a find counts on both sides.
      Wrong clicks cost 25 points and 3 seconds. Hints cost 50 points.
      Keys: Enter start · H hint · M mute · R restart · 1/2/3 pick a scene.
    </footer>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
